services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=Europe/Oslo

      # Fylles inn etter VPN-leverandør:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_REGIONS=${SERVER_REGIONS}
      - VPN_PORT_FORWARDING=on
      - >-
        VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c '
        until wget -qO- http://127.0.0.1:8080/api/v2/app/version >/dev/null 2>&1;
        do sleep 2; done;
        wget -qO- --post-data
        "json={\"listen_port\":{{PORT}},\"random_port\":false,\"upnp\":false}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'

      # Tillat qBittorrents webgrensesnitt gjennom Gluetun-brannmuren:
      - FIREWALL_INPUT_PORTS=8080

    volumes:
      - /srv/docker/gluetun:/gluetun

    ports:
      - "8080:8080"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent

    network_mode: "service:gluetun"

    depends_on:
      gluetun:
        condition: service_healthy

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Oslo
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881

    volumes:
      - /srv/docker/qbittorrent:/config
      - /srv/storage/downloads:/downloads

    restart: unless-stopped
