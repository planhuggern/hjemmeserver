services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=Europe/Oslo

      # Fylles inn etter VPN-leverandør:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_REGIONS=${SERVER_REGIONS}
      - VPN_PORT_FORWARDING=on
      - >-
        VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c '
        until wget -qO- http://127.0.0.1:8080/api/v2/app/version >/dev/null 2>&1;
        do sleep 2; done;
        wget -qO- --post-data
        "json={\"listen_port\":{{PORT}},\"random_port\":false,\"upnp\":false,\"current_network_interface\":\"tun0\"}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
      
      - >-
        VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c '
        wget -O- -nv --retry-connrefused --post-data
        "json={\"listen_port\":0}"
        http://127.0.0.1:8080/api/v2/app/setPreferences'
      # Tillat qBittorrents webgrensesnitt gjennom Gluetun-brannmuren:
      - FIREWALL_INPUT_PORTS=8080,9696
      - FIREWALL_OUTBOUND_SUBNETS=10.0.0.0/24

    volumes:
      - /srv/docker/gluetun:/gluetun

    ports:
      - "8080:8080"
      - "9696:9696"   # Prowlarr

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent

    network_mode: "service:gluetun"

    depends_on:
      gluetun:
        condition: service_healthy

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Oslo
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881

    volumes:
      - /srv/docker/qbittorrent:/config
      - /srv/storage/downloads:/downloads

    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Oslo
    volumes:
      - /srv/docker/prowlarr:/config
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:gluetun"

    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=Europe/Oslo

    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr

    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Oslo

    volumes:
      - /srv/docker/sonarr:/config
      - /srv/storage/downloads:/downloads
      - /srv/storage/media/tv:/tv

    ports:
      - "8989:8989"

    restart: unless-stopped